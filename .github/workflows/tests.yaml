name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Instalar dependências
      run: npm ci

    - name: Lint
      run: npm run lint
      continue-on-error: true

    - name: Build do projeto
      run: npm run build

    - name: Rodar testes
      run: npm run test
